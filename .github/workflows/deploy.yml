name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests (entity registry, routes)
        run: npm test
      - name: Type check
        run: npm run check:types
      - name: Component gallery still builds and passes the site check
        run: npm run build:kit && npm run check:site
      - name: Build (Astro + Pagefind index)
        run: npm run build
      - name: Site check (titles, canonical, hreflang pairs, links, sitemap)
        run: npm run check:site
      - name: Layout check (header edges, equal rows, icon columns, orphans, overflow; Chrome on the runner)
        run: npm run check:layout
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
